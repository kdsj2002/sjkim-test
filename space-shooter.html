<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스페이스 슈터 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            text-align: center;
        }

        canvas {
            border: 2px solid #00ff00;
            background: linear-gradient(to bottom, #000033, #000000);
            box-shadow: 0 0 20px #00ff00;
        }

        #gameInfo {
            color: #fff;
            margin-bottom: 10px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            width: 800px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 3px solid #00ff00;
            color: #00ff00;
            text-align: center;
            box-shadow: 0 0 30px #00ff00;
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }

        .instructions {
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.6;
        }

        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #00cc00;
            box-shadow: 0 0 20px #00ff00;
            transform: scale(1.1);
        }

        .stat {
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="gameInfo">
            <div class="stat">점수: <span id="score">0</span></div>
            <div class="stat">레벨: <span id="level">1</span></div>
            <div class="stat">체력: <span id="health">100</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="startScreen">
            <h1>🚀 스페이스 슈터 🚀</h1>
            <div class="instructions">
                <p>⬅️ ➡️ : 좌우 이동</p>
                <p>SPACE : 발사</p>
                <p>적을 처치하고 최고 점수를 달성하세요!</p>
            </div>
            <button onclick="startGame()">게임 시작</button>
        </div>

        <div id="gameOverScreen">
            <h2>게임 오버!</h2>
            <p style="font-size: 24px; margin: 20px 0;">최종 점수: <span id="finalScore">0</span></p>
            <p style="font-size: 20px; margin: 20px 0;">레벨: <span id="finalLevel">1</span></p>
            <button onclick="restartGame()">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 게임 상태
        let gameState = {
            running: false,
            score: 0,
            level: 1,
            health: 100
        };

        // 플레이어
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 80,
            width: 40,
            height: 40,
            speed: 5,
            color: '#00ff00'
        };

        // 게임 객체 배열
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // 키보드 입력
        const keys = {};

        // 별 생성 (배경)
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        // 이벤트 리스너
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' && gameState.running) {
                e.preventDefault();
                shootBullet();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // 게임 시작
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameState.running = true;
            gameState.score = 0;
            gameState.level = 1;
            gameState.health = 100;
            player.x = canvas.width / 2 - 20;
            player.y = canvas.height - 80;
            bullets = [];
            enemies = [];
            particles = [];
            updateUI();
            gameLoop();
        }

        // 게임 재시작
        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            startGame();
        }

        // 총알 발사
        function shootBullet() {
            bullets.push({
                x: player.x + player.width / 2 - 2,
                y: player.y,
                width: 4,
                height: 15,
                speed: 7,
                color: '#ffff00'
            });
        }

        // 적 생성
        function spawnEnemy() {
            const size = 30 + Math.random() * 20;
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: 1 + gameState.level * 0.3,
                color: '#ff0000',
                health: 1 + Math.floor(gameState.level / 3)
            });
        }

        // 파티클 생성 (폭발 효과)
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // UI 업데이트
        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('health').textContent = gameState.health;
        }

        // 충돌 감지
        function checkCollision(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        // 게임 오버
        function gameOver() {
            gameState.running = false;
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('finalLevel').textContent = gameState.level;
            document.getElementById('gameOverScreen').style.display = 'block';
        }

        // 게임 루프
        let lastEnemySpawn = 0;
        function gameLoop() {
            if (!gameState.running) return;

            // 화면 지우기
            ctx.fillStyle = 'rgba(0, 0, 51, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 별 그리기
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // 플레이어 이동
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // 플레이어 그리기
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // 총알 업데이트
            bullets = bullets.filter(bullet => {
                bullet.y -= bullet.speed;
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                return bullet.y > 0;
            });

            // 적 생성
            if (Date.now() - lastEnemySpawn > 1500 - gameState.level * 100) {
                spawnEnemy();
                lastEnemySpawn = Date.now();
            }

            // 적 업데이트
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed;

                // 적과 총알 충돌
                bullets = bullets.filter(bullet => {
                    if (checkCollision(bullet, enemy)) {
                        enemy.health--;
                        if (enemy.health <= 0) {
                            gameState.score += 10;
                            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff6600');

                            // 레벨업 체크
                            if (gameState.score % 100 === 0) {
                                gameState.level++;
                            }
                            updateUI();
                            return false;
                        }
                        createExplosion(bullet.x, bullet.y, '#ffff00');
                        return false;
                    }
                    return true;
                });

                // 적과 플레이어 충돌
                if (checkCollision(player, enemy)) {
                    gameState.health -= 10;
                    createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff0000');
                    updateUI();

                    if (gameState.health <= 0) {
                        gameOver();
                    }
                    return false;
                }

                // 적 그리기
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

                // 체력 표시
                if (enemy.health > 1) {
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(enemy.x, enemy.y - 5, enemy.width * (enemy.health / (1 + Math.floor(gameState.level / 3))), 3);
                }

                return enemy.y < canvas.height;
            });

            // 파티클 업데이트
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;

                ctx.fillStyle = particle.color;
                ctx.globalAlpha = particle.life / 30;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                return particle.life > 0;
            });

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
